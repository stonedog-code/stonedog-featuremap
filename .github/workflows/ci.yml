name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Gate (typecheck, lint, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tier
        run: npm test

      # The real maps are private repositories and are NOT on the runner, so
      # every case here skips. It is still run, deliberately: the suite prints
      # how many maps it examined, so this step's log is the standing evidence
      # that CI sees zero and a workstation sees three. A tier that only ever
      # runs where it passes is a tier nobody would notice breaking.
      - name: Integration tier (real maps absent on CI — asserts it examined 0)
        run: npm run test:integration

      # Both directions, in CI rather than only in a commit message. The
      # validator's whole job is refusing a bad map, so a build where it accepts
      # one must be red -- and `! cmd` is the only way to assert that a command
      # FAILS without the step passing on a crash for some other reason.
      # The tarball, not the checkout. `files`, `exports` and the packed
      # contents are invisible to every suite above -- they operate on source
      # files in this repo -- and they are exactly what breaks at publish time,
      # after review, when the version is already burned and cannot be reused.
      # dist/index.js is COMMITTED and is the only thing GitHub executes when a
      # repository uses this action. An edit under src/ that was not rebuilt
      # means every consumer silently runs the OLD logic and reports success —
      # this fleet's generated-artifact failure, arriving in the one file
      # nobody installs and everybody runs.
      #
      # Rebuild-and-diff, not an mtime comparison: checkout, clone and worktree
      # add all restamp files, so mtimes would cry stale on a healthy tree and
      # teach everyone to ignore the check.
      # action.yml is the one file every CONSUMING repository must parse, and
      # nothing here was checking it: actionlint lints workflows, check:bundle
      # compares the bundle, and the e2e runs dist/index.js directly. Two
      # defects shipped as v1.0.0 and failed in hopperguard rather than here.
      - name: action.yml is a manifest GitHub will load
        run: npm run check:action

      - name: The committed bundle matches src/
        run: npm run check:bundle

      # The bundle, executed the way the runner executes it. `check:bundle`
      # proves it is CURRENT, which is a different claim from RUNS — a CJS
      # bundle built cleanly here and died at load with "module is not defined",
      # and an earlier ESM one died on a dependency's dynamic require. Neither
      # was visible until something ran the file.
      #
      # `env -u GITHUB_EVENT_PATH` is load-bearing. This step exercises the MAP
      # half only, and without clearing that variable the action correctly reads
      # the runner's real pull_request payload, moves on to the coverage half,
      # and fails for want of a token — which is right behaviour meeting a step
      # that predates it.
      #
      # It is also a local-versus-CI trap worth naming: this passed locally
      # because `env -i` had cleared GITHUB_EVENT_PATH, and CI sets it. A local
      # harness that scrubs the environment is not a faithful stand-in for a
      # runner that populates it.
      - name: The action runs, and refuses an invalid map
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp test/fixtures/valid.json "$work/feature-map.json"
          env -u GITHUB_EVENT_PATH GITHUB_WORKSPACE="$work" GITHUB_OUTPUT="$work/out" node dist/index.js
          grep -q '^features<<' "$work/out" || { echo "::error::the action wrote no outputs"; exit 1; }

          cp test/fixtures/invalid.json "$work/feature-map.json"
          if env -u GITHUB_EVENT_PATH GITHUB_WORKSPACE="$work" GITHUB_OUTPUT="$work/out2" node dist/index.js; then
            echo "::error::the action accepted a map it must refuse"
            exit 1
          fi

          empty="$(mktemp -d)"
          if env -u GITHUB_EVENT_PATH GITHUB_WORKSPACE="$empty" GITHUB_OUTPUT="$empty/out" node dist/index.js; then
            echo "::error::the action passed with no map at all"
            exit 1
          fi

      # Enforcement, end to end, against a stub API — the unit tests prove the
      # decision and this proves the WIRING: inputs read, event parsed, files
      # paged, verdict acted on, exit code set. Every one of those is a place
      # the gate could quietly do nothing.
      #
      # The gitlink case is the one that matters most: it failed on every
      # submodule bump before hopperguard fixed it, and re-introducing that
      # would train people to merge past this gate again.
      - name: The action enforces coverage (pass, fail, and the gitlink regression)
        run: bash test/e2e-action.sh

      - name: Package (pack, install as a consumer, run it)
        run: npm run verify:package

      - name: The validator accepts a valid map (exit 0)
        run: npx tsx src/bin.ts test/fixtures/valid.json

      - name: The validator REFUSES an invalid map (exit 1)
        run: |
          if npx tsx src/bin.ts test/fixtures/invalid.json; then
            echo "::error::the validator accepted a map it must refuse"
            exit 1
          fi

      - name: A missing map is exit 2, not exit 1
        run: |
          npx tsx src/bin.ts test/fixtures/does-not-exist.json && code=0 || code=$?
          if [ "$code" != "2" ]; then
            echo "::error::expected exit 2 for an unreadable map, got $code"
            exit 1
          fi
